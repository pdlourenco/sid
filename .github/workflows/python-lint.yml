name: Python Lint

on:
  workflow_dispatch:
  push:
    paths:
      - 'python/sid/**.py'
      - 'python/tests/**.py'
      - 'python/pyproject.toml'
      - '.github/scripts/check_python_headers.py'
  # No pull_request path filter: this is a cheap check (~1 min), so it runs on
  # every PR to main and can therefore be a *required* status check without
  # wedging PRs that don't touch python/ — a required check that never runs
  # (because a path filter excluded it) stays "pending" forever. See ADR-0005.
  pull_request:
    branches: [main]

# Least-privilege token: this job only checks out and lints, so contents: read
# is all actions/checkout needs. Declaring the block explicitly also avoids the
# private-fork checkout 404 that bites any workflow which later adds a write
# scope (e.g. issues: write) without re-listing contents.
permissions:
  contents: read

jobs:
  ruff:
    name: Python lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        # Pinned (version + rule set): an unpinned linter is a gate whose
        # pass/fail changes with no repo change. Adopt ruff 0.16 (the version
        # CI resolves) per #163; the enforced rules are pinned explicitly in
        # pyproject's [tool.ruff.lint] select, so 0.16's expanded implicit
        # default does not silently widen the gate.
        run: pip install "ruff==0.16.*"

      - name: Lint check (ruff check)
        run: ruff check python/sid/ python/tests/

      - name: Format check (ruff format)
        run: ruff format --check python/sid/ python/tests/

      - name: Docstring standard
        run: python .github/scripts/check_python_headers.py
