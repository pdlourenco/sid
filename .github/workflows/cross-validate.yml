name: Cross-Language Validation

# Validates numerical equivalence across language implementations.
# Reference data (testdata/*.json) is generated by the MATLAB job in
# tests.yml and committed to the repository.  Each job below loads
# those JSON files, re-runs the sid functions under its own engine,
# and checks that outputs match within tolerance.
#
# The workflow triggers broadly, but each job uses a path condition
# so that only the relevant validators run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'matlab/**.m'
      - 'testdata/**'
      - 'python/**'
      - 'julia/**'
  pull_request:
    branches: [main]
    paths:
      - 'matlab/**.m'
      - 'testdata/**'
      - 'python/**'
      - 'julia/**'

# Least-privilege token: these jobs only check out and run validators, so
# contents: read is all actions/checkout needs. Declaring the block explicitly
# also avoids the private-fork checkout 404 that bites any workflow which later
# adds a write scope (e.g. issues: write) without re-listing contents.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      matlab: ${{ steps.filter.outputs.matlab }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            matlab:
              - 'matlab/**.m'
              - 'testdata/**'
            python:
              - 'python/**'
              - 'testdata/**'

  octave:
    name: Validate Octave against MATLAB reference
    needs: changes
    if: needs.changes.outputs.matlab == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Octave 11.x via snap (conda-forge has no octave 11; apt ships 8.4). See
      # the tests.yml Octave job for the rationale (#163).
      - name: Install GNU Octave 11.x
        run: |
          sudo snap install octave
          octave --version | head -1

      # Qt offscreen (no X server), NOT xvfb (snap Octave deadlocks under it);
      # no plotting here. stdin closed, timeout-guarded.
      - name: Run cross-language validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 600 octave --no-gui --eval "run('testdata/validate_reference.m')" < /dev/null

  validate-python:
    name: Validate Python port
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sid Python package
        run: pip install -e "./python[dev]"

      - name: Run cross-validation tests
        run: python -m pytest python/tests/test_cross_validation.py -v

  # Future: validate-julia job (Phase 3)
