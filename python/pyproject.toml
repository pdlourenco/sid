[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[project]
name = "sid-toolbox"
version = "0.1.0"
description = "System Identification Toolbox"
license = "MIT"
requires-python = ">= 3.10"
dependencies = [
    "numpy >= 1.22",
    "scipy >= 1.8",
]

[project.optional-dependencies]
plot = ["matplotlib >= 3.5"]
dev = [
    "pytest >= 7.0",
    "matplotlib >= 3.5",
    "nbmake >= 1.0",
    "ruff == 0.16.*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule SET explicitly, not just the ruff version. ruff's implicit
# default select expands across releases (0.16 pulls in flake8-simplify,
# pylint and ruff-specific rules), so an unspecified select is a gate that
# changes without a repo change -- the exact failure #163 exists to kill.
# This is ruff's historical default (E4/E7/E9/F) plus isort (I), the
# import-sorting #163 adopts. Broader families (SIM/RUF/PL) can be added
# later as a deliberate, separately-reviewed pass.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["sid"]
